<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الراضي العقارية - نشر إعلان</title>

<!-- BUILD: ALRADHI-2026-09-02-V2 -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:#f5f7fb;
    color:#172033;
}

header{
    background:linear-gradient(135deg,#101a36,#273b78);
    color:white;
    padding:22px 16px;
    text-align:center;
}

header h1{
    margin:0 0 7px;
    font-size:25px;
}

header p{
    margin:0;
    opacity:.85;
    font-size:14px;
}

.version{
    margin-top:8px;
    font-size:11px;
    opacity:.5;
}

.container{
    width:min(900px,94%);
    margin:25px auto;
}

.card{
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 8px 30px rgba(20,30,60,.07);
}

.card h2{
    margin-top:0;
    font-size:20px;
}

label{
    display:block;
    margin:15px 0 7px;
    font-weight:bold;
    font-size:14px;
}

input,
select,
textarea{
    width:100%;
    border:1px solid #dce2eb;
    border-radius:11px;
    padding:13px;
    font-size:15px;
    outline:none;
    background:#fff;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#5269d8;
    box-shadow:0 0 0 3px rgba(82,105,216,.1);
}

textarea{
    min-height:120px;
    resize:vertical;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

@media(max-width:650px){
    .grid{
        grid-template-columns:1fr;
    }
}

.auth-buttons{
    display:flex;
    gap:10px;
    margin-top:15px;
}

button{
    border:0;
    border-radius:11px;
    padding:13px 18px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

.btn-primary{
    background:#5269d8;
    color:white;
}

.btn-secondary{
    background:#edf0f7;
    color:#202b45;
}

.btn-danger{
    background:#e74c3c;
    color:white;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* =========================
   رفع الصور
========================= */

.upload-box{
    margin-top:10px;
    padding:18px;
    border:2px dashed #bfc8da;
    border-radius:15px;
    background:#fafbfe;
}

.upload-title{
    text-align:center;
    font-size:18px;
    font-weight:bold;
    margin-bottom:7px;
}

.upload-description{
    text-align:center;
    color:#6e7788;
    font-size:13px;
    margin-bottom:15px;
}

/*
   مهم:
   حقل اختيار الصور ظاهر فعلياً
*/
#images{
    display:block !important;
    width:100%;
    padding:12px;
    background:white;
    border:1px solid #ccd4e3;
    border-radius:10px;
}

#video{
    display:block !important;
    width:100%;
    padding:12px;
    background:white;
    border:1px solid #ccd4e3;
    border-radius:10px;
}

.selected-count{
    display:none;
    margin-top:12px;
    padding:11px;
    background:#eef4ff;
    border-radius:10px;
    color:#3155b7;
    font-weight:bold;
    text-align:center;
}

.preview{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:14px;
}

@media(max-width:600px){
    .preview{
        grid-template-columns:repeat(2,1fr);
    }
}

.preview-item{
    position:relative;
}

.preview img,
.preview video{
    width:100%;
    height:130px;
    object-fit:cover;
    border-radius:11px;
    border:1px solid #e0e4ec;
    display:block;
}

.file-name{
    font-size:11px;
    margin-top:4px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    color:#667085;
}

/* =========================
   النشر
========================= */

.publish-btn{
    width:100%;
    background:linear-gradient(135deg,#5269d8,#7357db);
    color:white;
    font-size:17px;
    padding:16px;
    margin-top:20px;
}

.progress-container{
    display:none;
    margin-top:15px;
}

.progress-bar{
    height:8px;
    background:#e7eaf1;
    border-radius:20px;
    overflow:hidden;
}

.progress-fill{
    width:0%;
    height:100%;
    background:#5269d8;
    transition:.3s;
}

.status{
    display:none;
    margin-top:15px;
    padding:13px;
    border-radius:10px;
    font-size:14px;
    line-height:1.6;
}

.status.loading{
    display:block;
    background:#eef4ff;
    color:#3155b7;
}

.status.success{
    display:block;
    background:#eaf8ef;
    color:#198754;
}

.status.error{
    display:block;
    background:#fff0ef;
    color:#c0392b;
}

/* =========================
   الإعلانات
========================= */

.properties{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

@media(max-width:650px){
    .properties{
        grid-template-columns:1fr;
    }
}

.property{
    border:1px solid #e4e8f0;
    border-radius:15px;
    overflow:hidden;
    background:white;
}

.property-media{
    width:100%;
    height:220px;
    object-fit:cover;
    display:block;
    background:#edf0f5;
}

.property-body{
    padding:15px;
}

.property-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:8px;
}

.property-info{
    color:#667085;
    font-size:13px;
    line-height:1.8;
}

.price{
    color:#5269d8;
    font-weight:bold;
    font-size:17px;
    margin-top:8px;
}

.empty{
    text-align:center;
    color:#777;
    padding:30px;
}

.user-box{
    padding:12px;
    background:#f4f6fa;
    border-radius:10px;
    font-size:14px;
}

.debug{
    display:none;
    margin-top:10px;
    padding:10px;
    background:#111827;
    color:#fff;
    border-radius:10px;
    font-family:monospace;
    font-size:12px;
    direction:ltr;
    text-align:left;
}
</style>
</head>

<body>

<header>
    <h1>🏠 شركة الراضي العقارية</h1>
    <p>منصة نشر الإعلانات العقارية</p>
    <div class="version">BUILD ALRADHI-2026-09-02-V2</div>
</header>

<div class="container">

<!-- =========================
     الحساب
========================= -->

<div class="card">

    <h2>👤 الحساب</h2>

    <div id="userBox" class="user-box">
        غير مسجل الدخول
    </div>

    <div id="authArea">

        <label>البريد الإلكتروني</label>
        <input
            id="email"
            type="email"
            placeholder="example@email.com"
        >

        <label>كلمة المرور</label>
        <input
            id="password"
            type="password"
            placeholder="كلمة المرور"
        >

        <div class="auth-buttons">

            <button
                class="btn-primary"
                onclick="signup()"
            >
                إنشاء حساب
            </button>

            <button
                class="btn-secondary"
                onclick="login()"
            >
                تسجيل الدخول
            </button>

        </div>

    </div>

    <button
        id="logoutBtn"
        class="btn-danger"
        onclick="logout()"
        style="display:none;margin-top:12px;width:100%;"
    >
        تسجيل الخروج
    </button>

</div>


<!-- =========================
     نشر إعلان
========================= -->

<div class="card">

    <h2>📢 نشر إعلان عقاري</h2>

    <label>عنوان الإعلان</label>

    <input
        id="title"
        type="text"
        placeholder="مثال: شقة للبيع في دمشق"
    >


    <div class="grid">

        <div>

            <label>نوع العملية</label>

            <select id="purpose">

                <option value="sale">
                    للبيع
                </option>

                <option value="rent">
                    للإيجار
                </option>

            </select>

        </div>


        <div>

            <label>نوع العقار</label>

            <select id="property_type">

                <option value="apartment">
                    شقة
                </option>

                <option value="house">
                    منزل
                </option>

                <option value="villa">
                    فيلا
                </option>

                <option value="land">
                    أرض
                </option>

                <option value="shop">
                    محل تجاري
                </option>

                <option value="office">
                    مكتب
                </option>

                <option value="building">
                    بناء
                </option>

                <option value="other">
                    أخرى
                </option>

            </select>

        </div>

    </div>


    <div class="grid">

        <div>

            <label>السعر</label>

            <input
                id="price"
                type="number"
                placeholder="السعر"
            >

        </div>


        <div>

            <label>العملة</label>

            <select id="currency">

                <option value="USD">
                    دولار أمريكي
                </option>

                <option value="SYP">
                    ليرة سورية
                </option>

                <option value="EUR">
                    يورو
                </option>

            </select>

        </div>

    </div>


    <div class="grid">

        <div>

            <label>المحافظة / المدينة</label>

            <input
                id="city"
                type="text"
                placeholder="دمشق"
            >

        </div>


        <div>

            <label>الموقع</label>

            <input
                id="location"
                type="text"
                placeholder="المزة - دمشق"
            >

        </div>

    </div>


    <div class="grid">

        <div>

            <label>المساحة بالمتر</label>

            <input
                id="area_m2"
                type="number"
                placeholder="120"
            >

        </div>


        <div>

            <label>عدد الغرف</label>

            <input
                id="rooms"
                type="number"
                placeholder="3"
            >

        </div>

    </div>


    <div class="grid">

        <div>

            <label>عدد الحمامات</label>

            <input
                id="bathrooms"
                type="number"
                placeholder="2"
            >

        </div>


        <div>

            <label>الطابق</label>

            <input
                id="floor"
                type="text"
                placeholder="الثالث"
            >

        </div>

    </div>


    <label>وصف العقار</label>

    <textarea
        id="description"
        placeholder="اكتب تفاصيل العقار..."
    ></textarea>


    <!-- =========================
         الصور
    ========================= -->

    <label>📷 صور العقار</label>

    <div class="upload-box">

        <div class="upload-title">
            📷 اختر صور العقار
        </div>

        <div class="upload-description">
            يمكنك اختيار صورة واحدة أو عدة صور من معرض الهاتف
        </div>

        <!--
            لا يوجد label مخفي هنا.
            الحقل ظاهر فعلياً.
        -->

        <input
            id="images"
            type="file"
            accept="image/jpeg,image/png,image/webp,image/gif"
            multiple
        >

        <div
            id="imageCount"
            class="selected-count"
        ></div>

        <div
            id="imagePreview"
            class="preview"
        ></div>

    </div>


    <!-- =========================
         الفيديو
    ========================= -->

    <label>🎥 فيديو العقار - اختياري</label>

    <div class="upload-box">

        <div class="upload-title">
            🎥 اختر فيديو
        </div>

        <div class="upload-description">
            الفيديو اختياري
        </div>

        <input
            id="video"
            type="file"
            accept="video/mp4,video/webm,video/quicktime"
        >

        <div
            id="videoPreview"
            class="preview"
        ></div>

    </div>


    <!-- Debug -->
    <div
        id="debug"
        class="debug"
    ></div>


    <!-- Progress -->

    <div
        id="progressContainer"
        class="progress-container"
    >

        <div class="progress-bar">

            <div
                id="progressFill"
                class="progress-fill"
            ></div>

        </div>

    </div>


    <!-- Status -->

    <div
        id="status"
        class="status"
    ></div>


    <button
        id="publishBtn"
        class="publish-btn"
        onclick="publishProperty()"
    >
        🚀 نشر الإعلان
    </button>

</div>


<!-- =========================
     الإعلانات
========================= -->

<div class="card">

    <h2>🏠 الإعلانات المنشورة</h2>

    <div
        id="properties"
        class="properties"
    >
        <div class="empty">
            جارٍ تحميل الإعلانات...
        </div>
    </div>

</div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://ipjhnynottehhzukbhje.supabase.co";

const SUPABASE_KEY =
"sb_publishable_CVGI2bG9MOHc9oaOJ2GmLw_rm9T37li";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;


/* =====================================================
   ELEMENTS
===================================================== */

const imageInput =
document.getElementById("images");

const imagePreview =
document.getElementById("imagePreview");

const imageCount =
document.getElementById("imageCount");

const videoInput =
document.getElementById("video");

const videoPreview =
document.getElementById("videoPreview");


/* =====================================================
   الصور
===================================================== */

imageInput.addEventListener("change", function(){

    console.log(
        "عدد الملفات:",
        imageInput.files.length
    );

    imagePreview.innerHTML = "";

    const files =
        Array.from(imageInput.files || [])
        .filter(function(file){

            return file.type.startsWith("image/");

        });


    if(files.length === 0){

        imageCount.style.display = "none";

        return;
    }


    imageCount.style.display = "block";

    imageCount.innerHTML =
        "📷 تم اختيار <strong>"
        + files.length
        + "</strong> صورة";


    files.forEach(function(file){

        const item =
            document.createElement("div");

        item.className =
            "preview-item";


        const img =
            document.createElement("img");


        img.src =
            URL.createObjectURL(file);


        const name =
            document.createElement("div");

        name.className =
            "file-name";

        name.textContent =
            file.name;


        item.appendChild(img);

        item.appendChild(name);

        imagePreview.appendChild(item);

    });

});


/* =====================================================
   الفيديو
===================================================== */

videoInput.addEventListener("change", function(){

    videoPreview.innerHTML = "";

    const file =
        videoInput.files &&
        videoInput.files[0];


    if(!file){
        return;
    }


    const video =
        document.createElement("video");

    video.src =
        URL.createObjectURL(file);

    video.controls = true;

    videoPreview.appendChild(video);

});


/* =====================================================
   STATUS
===================================================== */

function showStatus(message,type){

    const status =
        document.getElementById("status");

    status.className =
        "status " + type;

    status.innerHTML =
        message;

}


/* =====================================================
   PROGRESS
===================================================== */

function setProgress(value){

    const container =
        document.getElementById(
            "progressContainer"
        );

    const fill =
        document.getElementById(
            "progressFill"
        );

    container.style.display =
        "block";

    fill.style.width =
        value + "%";

}


/* =====================================================
   DEBUG
===================================================== */

function showDebug(text){

    const debug =
        document.getElementById("debug");

    debug.style.display =
        "block";

    debug.textContent =
        text;

}


/* =====================================================
   SIGN UP
===================================================== */

async function signup(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    if(!email || !password){

        alert(
            "أدخل البريد الإلكتروني وكلمة المرور"
        );

        return;
    }


    if(password.length < 6){

        alert(
            "كلمة المرور يجب أن تكون 6 أحرف على الأقل"
        );

        return;
    }


    showStatus(
        "⏳ جارٍ إنشاء الحساب...",
        "loading"
    );


    const {
        data,
        error
    } =
    await supabaseClient.auth.signUp({

        email:email,

        password:password

    });


    if(error){

        showStatus(
            "❌ فشل إنشاء الحساب:<br>"
            + escapeHtml(error.message),
            "error"
        );

        return;
    }


    showStatus(
        "✅ تم إنشاء الحساب بنجاح.",
        "success"
    );

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    if(!email || !password){

        alert(
            "أدخل البريد الإلكتروني وكلمة المرور"
        );

        return;
    }


    showStatus(
        "⏳ جارٍ تسجيل الدخول...",
        "loading"
    );


    const {
        data,
        error
    } =
    await supabaseClient.auth.signInWithPassword({

        email:email,

        password:password

    });


    if(error){

        showStatus(
            "❌ فشل تسجيل الدخول:<br>"
            + escapeHtml(error.message),
            "error"
        );

        return;
    }


    currentUser =
        data.user;


    updateUserUI();


    showStatus(
        "✅ تم تسجيل الدخول بنجاح.",
        "success"
    );

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    await supabaseClient.auth.signOut();

    currentUser =
        null;

    updateUserUI();

}


/* =====================================================
   USER UI
===================================================== */

function updateUserUI(){

    const userBox =
        document.getElementById("userBox");

    const logoutBtn =
        document.getElementById("logoutBtn");

    const authArea =
        document.getElementById("authArea");


    if(currentUser){

        userBox.innerHTML =
            "✅ مسجل الدخول:<br>"
            + escapeHtml(
                currentUser.email || ""
            );

        logoutBtn.style.display =
            "block";

        authArea.style.display =
            "none";

    }else{

        userBox.innerHTML =
            "غير مسجل الدخول";

        logoutBtn.style.display =
            "none";

        authArea.style.display =
            "block";

    }

}


/* =====================================================
   PUBLISH PROPERTY
===================================================== */

async function publishProperty(){

    const publishBtn =
        document.getElementById(
            "publishBtn"
        );


    try{

        /* ---------------------------------------------
           التأكد من تسجيل الدخول
        --------------------------------------------- */

        if(!currentUser){

            throw new Error(
                "يجب تسجيل الدخول أولاً."
            );

        }


        /* ---------------------------------------------
           قراءة الصور مباشرة من input.files
        --------------------------------------------- */

        const realFiles =
            Array.from(
                imageInput.files || []
            ).filter(function(file){

                return file.type.startsWith("image/");

            });


        console.log(
            "عدد الصور وقت النشر:",
            realFiles.length
        );


        showDebug(
            "IMAGE FILES = "
            + realFiles.length
        );


        /* ---------------------------------------------
           أهم فحص
        --------------------------------------------- */

        if(realFiles.length === 0){

            throw new Error(
                "📷 لم يتم استلام أي صورة من حقل الصور. يرجى اختيار الصورة مرة أخرى."
            );

        }


        /* ---------------------------------------------
           البيانات
        --------------------------------------------- */

        const title =
            document.getElementById(
                "title"
            ).value.trim();


        const description =
            document.getElementById(
                "description"
            ).value.trim();


        const purpose =
            document.getElementById(
                "purpose"
            ).value;


        const property_type =
            document.getElementById(
                "property_type"
            ).value;


        const priceValue =
            document.getElementById(
                "price"
            ).value;


        const currency =
            document.getElementById(
                "currency"
            ).value;


        const city =
            document.getElementById(
                "city"
            ).value.trim();


        const location =
            document.getElementById(
                "location"
            ).value.trim();


        const areaValue =
            document.getElementById(
                "area_m2"
            ).value;


        const roomsValue =
            document.getElementById(
                "rooms"
            ).value;


        const bathroomsValue =
            document.getElementById(
                "bathrooms"
            ).value;


        const floor =
            document.getElementById(
                "floor"
            ).value.trim();


        /* ---------------------------------------------
           التحقق
        --------------------------------------------- */

        if(!title){

            throw new Error(
                "اكتب عنوان الإعلان."
            );

        }


        if(!city){

            throw new Error(
                "اكتب المدينة أو المحافظة."
            );

        }


        /* ---------------------------------------------
           زر النشر
        --------------------------------------------- */

        publishBtn.disabled =
            true;

        publishBtn.innerHTML =
            "⏳ جارٍ نشر الإعلان...";


        showStatus(
            "⏳ جارٍ إنشاء الإعلان...",
            "loading"
        );


        setProgress(10);


        /* ---------------------------------------------
           إنشاء الإعلان
        --------------------------------------------- */

        const propertyData = {

            owner_id:
                currentUser.id,

            title:
                title,

            description:
                description,

            purpose:
                purpose,

            property_type:
                property_type,

            price:
                priceValue
                    ? Number(priceValue)
                    : null,

            currency:
                currency,

            city:
                city,

            location:
                location,

            area_m2:
                areaValue
                    ? Number(areaValue)
                    : null,

            rooms:
                roomsValue
                    ? Number(roomsValue)
                    : null,

            bathrooms:
                bathroomsValue
                    ? Number(bathroomsValue)
                    : null,

            floor:
                floor,

            status:
                "pending"

        };


        const {
            data:property,
            error:propertyError
        } =
        await supabaseClient
            .from("properties")
            .insert(propertyData)
            .select()
            .single();


        if(propertyError){

            throw propertyError;

        }


        setProgress(25);


        /* ---------------------------------------------
           رفع الصور
        --------------------------------------------- */

        for(
            let i = 0;
            i < realFiles.length;
            i++
        ){

            const file =
                realFiles[i];


            const extension =
                getExtension(file.name);


            const fileName =
                Date.now()
                + "-"
                + i
                + "-"
                + Math.random()
                    .toString(36)
                    .substring(2)
                + "."
                + extension;


            const storagePath =
                "properties/"
                + property.id
                + "/images/"
                + fileName;


            showStatus(
                "📷 جارٍ رفع الصورة "
                + (i + 1)
                + " من "
                + realFiles.length
                + "...",
                "loading"
            );


            const {
                error:uploadError
            } =
            await supabaseClient
                .storage
                .from("property-media")
                .upload(
                    storagePath,
                    file,
                    {
                        cacheControl:"3600",
                        upsert:false
                    }
                );


            if(uploadError){

                throw uploadError;

            }


            setProgress(
                25
                +
                Math.round(
                    ((i + 1)
                    /
                    realFiles.length)
                    * 50
                )
            );


            /* -----------------------------------------
               رابط الصورة
            ----------------------------------------- */

            const {
                data:publicData
            } =
            supabaseClient
                .storage
                .from("property-media")
                .getPublicUrl(
                    storagePath
                );


            const imageUrl =
                publicData.publicUrl;


            /* -----------------------------------------
               حفظ معلومات الصورة
            ----------------------------------------- */

            const {
                error:imageDbError
            } =
            await supabaseClient
                .from("property_images")
                .insert({

                    property_id:
                        property.id,

                    storage_path:
                        storagePath,

                    image_url:
                        imageUrl,

                    sort_order:
                        i

                });


            if(imageDbError){

                throw imageDbError;

            }

        }


        /* ---------------------------------------------
           الفيديو اختياري
        --------------------------------------------- */

        const videoFile =
            videoInput.files &&
            videoInput.files[0];


        if(videoFile){

            showStatus(
                "🎥 جارٍ رفع الفيديو...",
                "loading"
            );


            const extension =
                getExtension(
                    videoFile.name
                );


            const videoName =
                Date.now()
                + "-video."
                + extension;


            const videoPath =
                "properties/"
                + property.id
                + "/video/"
                + videoName;


            const {
                error:videoUploadError
            } =
            await supabaseClient
                .storage
                .from("property-media")
                .upload(
                    videoPath,
                    videoFile,
                    {
                        cacheControl:"3600",
                        upsert:false
                    }
                );


            if(videoUploadError){

                throw videoUploadError;

            }


            const {
                data:videoPublicData
            } =
            supabaseClient
                .storage
                .from("property-media")
                .getPublicUrl(
                    videoPath
                );


            const videoUrl =
                videoPublicData.publicUrl;


            const {
                error:videoDbError
            } =
            await supabaseClient
                .from("property_videos")
                .insert({

                    property_id:
                        property.id,

                    storage_path:
                        videoPath,

                    video_url:
                        videoUrl

                });


            if(videoDbError){

                throw videoDbError;

            }

        }


        setProgress(100);


        /* ---------------------------------------------
           نجاح
        --------------------------------------------- */

        showStatus(
            "✅ تم نشر الإعلان بنجاح.<br>"
            + "الإعلان الآن بانتظار المراجعة.",
            "success"
        );


        publishBtn.innerHTML =
            "✅ تم نشر الإعلان";


        /* ---------------------------------------------
           تنظيف النموذج
        --------------------------------------------- */

        document.getElementById(
            "title"
        ).value = "";


        document.getElementById(
            "description"
        ).value = "";


        document.getElementById(
            "price"
        ).value = "";


        document.getElementById(
            "city"
        ).value = "";


        document.getElementById(
            "location"
        ).value = "";


        document.getElementById(
            "area_m2"
        ).value = "";


        document.getElementById(
            "rooms"
        ).value = "";


        document.getElementById(
            "bathrooms"
        ).value = "";


        document.getElementById(
            "floor"
        ).value = "";


        imageInput.value =
            "";

        videoInput.value =
            "";


        imagePreview.innerHTML =
            "";

        videoPreview.innerHTML =
            "";


        imageCount.style.display =
            "none";


        await loadProperties();


        setTimeout(function(){

            publishBtn.disabled =
                false;

            publishBtn.innerHTML =
                "🚀 نشر إعلان جديد";

            document.getElementById(
                "progressContainer"
            ).style.display =
                "none";

        },1500);


    }catch(error){

        console.error(
            "PUBLISH ERROR:",
            error
        );


        showStatus(
            "❌ فشل نشر الإعلان:<br>"
            + escapeHtml(
                error.message ||
                String(error)
            ),
            "error"
        );


        publishBtn.disabled =
            false;

        publishBtn.innerHTML =
            "🚀 إعادة محاولة النشر";


        document.getElementById(
            "progressContainer"
        ).style.display =
            "none";

    }

}


/* =====================================================
   تحميل الإعلانات
===================================================== */

async function loadProperties(){

    const container =
        document.getElementById(
            "properties"
        );


    container.innerHTML =
        '<div class="empty">⏳ جارٍ تحميل الإعلانات...</div>';


    const {
        data,
        error
    } =
    await supabaseClient
        .from("properties")
        .select("*")
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(error);

        container.innerHTML =
            '<div class="empty">❌ تعذر تحميل الإعلانات</div>';

        return;
    }


    if(!data || data.length === 0){

        container.innerHTML =
            '<div class="empty">لا توجد إعلانات حتى الآن.</div>';

        return;
    }


    container.innerHTML =
        "";


    for(
        const property
        of data
    ){

        await renderProperty(
            property,
            container
        );

    }

}


/* =====================================================
   عرض إعلان
===================================================== */

async function renderProperty(
    property,
    container
){

    const card =
        document.createElement(
            "div"
        );

    card.className =
        "property";


    let mediaHtml =
        "";


    /* ---------------------------------------------
       الصور
    --------------------------------------------- */

    const {
        data:images
    } =
    await supabaseClient
        .from("property_images")
        .select("*")
        .eq(
            "property_id",
            property.id
        )
        .order(
            "sort_order",
            {
                ascending:true
            }
        );


    if(
        images &&
        images.length > 0
    ){

        mediaHtml =
            '<img class="property-media" src="'
            + escapeAttribute(
                images[0].image_url
            )
            + '" alt="صورة العقار">';

    }else{

        mediaHtml =
            '<div class="property-media" style="display:flex;align-items:center;justify-content:center;">🏠 لا توجد صورة</div>';

    }


    card.innerHTML =

        mediaHtml

        +

        '<div class="property-body">'

        +

        '<div class="property-title">'
        +
        escapeHtml(
            property.title ||
            "عقار"
        )
        +
        '</div>'

        +

        '<div class="property-info">'

        +
        '📍 '
        +
        escapeHtml(
            property.city ||
            ""
        )

        +
        (
            property.location
            ?
            '<br>📌 '
            +
            escapeHtml(
                property.location
            )
            :
            ""
        )

        +
        (
            property.area_m2
            ?
            '<br>📐 المساحة: '
            +
            property.area_m2
            +
            ' م²'
            :
            ""
        )

        +
        (
            property.rooms
            ?
            '<br>🛏️ الغرف: '
            +
            property.rooms
            :
            ""
        )

        +

        '</div>'

        +

        (
            property.price
            ?
            '<div class="price">'
            +
            escapeHtml(
                String(property.price)
            )
            +
            ' '
            +
            escapeHtml(
                property.currency ||
                ""
            )
            +
            '</div>'
            :
            ""
        )

        +

        '</div>';


    container.appendChild(
        card
    );

}


/* =====================================================
   SESSION
===================================================== */

async function checkSession(){

    const {
        data
    } =
    await supabaseClient.auth.getSession();


    currentUser =
        data.session
        ?
        data.session.user
        :
        null;


    updateUserUI();

}


/* =====================================================
   AUTH STATE
===================================================== */

supabaseClient.auth.onAuthStateChange(
    function(event,session){

        currentUser =
            session
            ?
            session.user
            :
            null;

        updateUserUI();

    }
);


/* =====================================================
   HELPERS
===================================================== */

function getExtension(filename){

    const parts =
        filename.split(".");


    if(parts.length < 2){

        return "file";

    }


    return parts
        .pop()
        .toLowerCase()
        .replace(
            /[^a-z0-9]/g,
            ""
        );

}


function escapeHtml(value){

    return String(value || "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(value){

    return escapeHtml(value);

}


/* =====================================================
   START
===================================================== */

checkSession();

loadProperties();

</script>
